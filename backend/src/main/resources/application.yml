spring:
  datasource:
    url: jdbc:postgresql://localhost:5432/radion_db
    username: radion_user
    password: radion_password
  jpa:
    hibernate:
      ddl-auto: update
    show-sql: false
    properties:
      hibernate:
        dialect: org.hibernate.dialect.PostgreSQLDialect

server:
  port: 8080

radion:
  security:
    encryption-key: ${ENCRYPTION_KEY}
  ai:
    provider: gemini # or openai
    system-instruction-path: "classpath:ai/system_instruction.md"
    command-schema-path: "classpath:ai/business_command_schema.json"
    gemini:
      api-key: ${GEMINI_API_KEY:mock-key}
      model: ${GEMINI_MODEL:gemini-flash-latest}

    openai:

      api-key: ${OPENAI_API_KEY:mock-key}

logging:
  level:
    org.springframework.transaction: TRACE
    org.springframework.orm.jpa: TRACE
    org.hibernate.SQL: DEBUG
    org.hibernate.type.descriptor.sql.BasicBinder: TRACE

google:
  client:
    id: ${GOOGLE_CLIENT_ID}
    secret: ${GOOGLE_CLIENT_SECRET}
  redirect:
    uri: ${GOOGLE_REDIRECT_URI:http://localhost:8080/api/integrations/google/callback}